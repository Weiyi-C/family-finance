# Flutter Web App — 代理到 flutter-web 容器
server {
    listen 8090;
    server_name _;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $flutter flutter-web:80;
        proxy_pass http://$flutter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        set $flutter flutter-web:80;
        proxy_pass http://$flutter;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}

# 主站（开发环境）
server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 50M;

    # API proxy
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（支持 AI 批量处理）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check (direct, no /api prefix)
    location /health {
        set $api_health api:8000;
        proxy_pass http://$api_health/health;
        proxy_set_header Host $host;
    }

    # Frontend (dev: proxy to vite, prod: serve static)
    location / {
        set $web_upstream web:5173;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
