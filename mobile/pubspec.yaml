name: family_finance_app
description: "家庭记账APP - 治愈系萌趣风格"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # 网络请求
  dio: ^5.7.0
  
  # 本地存储
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  
  # 路由
  go_router: ^14.6.2
  
  # UI 组件
  flutter_svg: ^2.0.16
  fl_chart: ^0.70.2
  lottie: ^3.3.1
  
  # 数据序列化
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  dio_smart_retry: ^6.0.0
  
  # 图标
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # 代码生成
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.2
  
  # Lint
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/icons/categories/
    - assets/icons/navigation/
    - assets/icons/actions/
    - assets/icons/status/
    - assets/images/
    - assets/animations/
  
  # fonts:
  #   - family: Nunito
  #     fonts:
  #       - asset: assets/fonts/Nunito-Regular.ttf
  #       - asset: assets/fonts/Nunito-Bold.ttf
  #         weight: 700
